# Production-ready stack for a single VPS: app + PostgreSQL with persistent volumes.
# Put a TLS-terminating reverse proxy (Caddy / nginx) in front — see DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: abcarino
      POSTGRES_USER: abcarino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abcarino -d abcarino"]
      interval: 10s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://abcarino:${POSTGRES_PASSWORD}@db:5432/abcarino
      APP_URL: ${APP_URL:?Set APP_URL in .env, e.g. https://abcarino.com}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      TRUST_PROXY: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-ABCARINO Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media:/app/storage

volumes:
  pgdata:
  media:
